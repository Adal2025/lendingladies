<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Events - Lending Ladies TX</title>
    <link rel="stylesheet" href="past-events-style.css">
</head>
<body>
    <body>
    <a href="index.html" class="back-to-home">&#10094;</a>

<header class="page-header">
    <h1>Our Past Events</h1>
</header>

<main class="events-container">
    <section class="event-card">

        <div class="event-details-column">
            <div class="detail-item"><strong>Event Name:</strong> Havana Nights</div>
            <div class="detail-item"><strong>Date:</strong> October 1st, 2025</div>
            <div class="detail-item"><strong>Location:</strong> Julep</div>
            <div class="detail-item"><strong>Theme:</strong> Havana Nights</div>

            <div class="bottom-widgets">
                <div class="widget photo-widget">
                    <img src="img/Havana - testimonial.jpeg" alt="Event attendee photo">
                </div>
                <div class="widget testimonial-widget">
                    <h4>Testimonial</h4>
                    <blockquote>
                        "An unforgettable night full of connections and amazing energy. Lending Ladies TX knows how to create a powerful community."
                    </blockquote>
                    <cite>— Jane Doe</cite>
                </div>
            </div>
        </div>

        <div class="event-slider-column">
            <div class="slider-container">
                <div class="slider-images">
                    <img src="img/Havana - Ima 1.jpeg" alt="Event Photo 1" class="slider-img">
                    <img src="img/Havana - Ima 2.jpeg" alt="Event Photo 2" class="slider-img">
                    <img src="img/Havana - Ima 3.jpeg" alt="Event Photo 3" class="slider-img">
                </div>
                <button class="nav-btn prev">&lt;</button>
                <button class="nav-btn next">&gt;</button>
            </div>
        </div>
        
    </section>
    </main>

<div id="lightbox-modal" class="lightbox">
    <span class="close-btn">&times;</span>
    
    <a class="lightbox-nav prev">&#10094;</a>
    <a class="lightbox-nav next">&#10095;</a>
    
    <img class="lightbox-content" id="lightbox-image">
</div>

<script src="past-events-script.js"></script>
</body>
</html>
